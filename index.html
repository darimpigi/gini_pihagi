<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>GINI_PIHAGI</title>
    <link rel="stylesheet" href="style.css">
    <script src="https://html2canvas.hertzen.com/dist/html2canvas.min.js"></script>
</head>
<body>
    <!-- 💡 가로 모드일 때 나타날 경고 화면 -->
    <div id="landscape-warning">
        <div class="warning-content">
            <span class="warning-icon">📱🔄</span>
            <h2>세로 모드 최적화</h2>
            <p>화면을 세로로 돌려서 플레이해 주세요!<br>(Please rotate your device to portrait mode)</p>
        </div>
    </div>

    <div id="main-wrapper">
        
        <div id="game-layout-wrapper">
            
            <div id="character-selection">
                <h3 id="t-selectChar">SELECT<br>CHAR</h3>
                <div class="character-options">
                    <button id="char1-btn" class="char-btn selected"><img src="images/gini_1.png" alt="Gini 1"></button>
                    <button id="char2-btn" class="char-btn"><img src="images/gini_2.png" alt="Gini 2"></button>
                    <button id="char3-btn" class="char-btn"><img src="images/rabbit.png" alt="Rabbit"></button>
                </div>
                
                <div class="mode-toggle-section">
                    <h3 id="t-filterText">클린 모드</h3>
                    <button id="filter-btn" class="char-btn">
                        <img id="filter-img" src="images/water.png" alt="Mode Toggle">
                    </button>
                </div>
            </div>

            <div id="game-area">
                <div id="top-bar">
                    <button id="lang-btn">KR / EN</button>
                    <button id="sound-btn">SOUND ON</button>
                </div>
                
                <div id="game-container">
                    <canvas id="gameCanvas" width="400" height="600"></canvas>
                    
                    <div id="ui">
                        <div id="scoreDisplay">
                            <div><span id="t-score">SCORE </span><span id="score">0</span></div>
                            <div id="bestScoreDisplay"><span id="t-best">BEST </span><span id="bestScore">0</span></div>
                        </div>
                        
                        <div id="countdown" class="hidden">3</div>
                        
                        <div id="initialScreen">
                            <h2 id="t-title">DODGE GAME</h2>
                            <p id="t-desc">Select Character<br>& Start</p>
                            <button id="start-btn">START</button>
                        </div>
                        
                        <div id="gameOver" class="hidden">
                            <div id="gameOverPlaceholder"></div> 
                            <img id="gameOverImg" src="" alt="Game Over">
                            <h2 id="t-gameover">GAME OVER</h2>
                            <p><span id="t-finalScore">SCORE: </span><span id="finalScore">0</span></p>
                            <p><span id="t-finalBest">BEST: </span><span id="finalBestScore">0</span></p>
                            
                            <p><span id="t-finalTime">TIME: </span><span id="finalTime">0.0s</span></p>
                            
                            <p class="blink-text" id="t-restart" data-html2canvas-ignore="true">Click or 'R' to Restart</p>
                            
                            <div class="share-btn-group" data-html2canvas-ignore="true">
                                <button id="capture-btn">이미지 저장</button>
                                <button id="copy-btn">결과 복사</button>
                                <button id="share-x-btn">X 공유</button>
                                <button id="restart-game-btn">다시 시작</button>
                            </div>
                        </div>
                    </div>
                </div>

                <div id="mobile-controls">
                    <button id="btn-left">◀</button>
                    <button id="btn-right">▶</button>
                </div>

                <div id="social-links">
                    <a href="https://twitter.com/darim_pigi" target="_blank" rel="noopener noreferrer">X :: @darim_pigi</a>
                    <span class="divider">|</span>
                    <a href="https://instagram.com/darim_pigi" target="_blank" rel="noopener noreferrer">INSTAGRAM :: @darim_pigi</a>
                </div>
                
            </div> 
            
        </div> 

    </div>
    <script src="script.js"></script>
</body>
</html>
